services:
  redis:
    image: redis
    container_name: redis-service
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_STORAGE_SECRET_KEY}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    restart: unless-stopped

  backend:
    build:
      context: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    container_name: django-backend-service
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - db
      - redis
      - minio
    env_file:
      - .env
    restart: unless-stopped

  # Celery Beat
  beat:
    build:
      context: .
    command: uv run celery -A core beat -l INFO
    volumes:
      - ./app:/app
    depends_on:
      - redis
      - backend
    env_file:
      - .env
    restart: unless-stopped

  # Celery Worker
  worker:
    build:
      context: .
    command: uv run celery -A core worker -l INFO
    volumes:
      - ./app:/app
    depends_on:
      - redis
      - backend
      - beat
    env_file:
      - .env
    restart: unless-stopped

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      # Change the number before : to the port the web interface should be accessible on
      - "5000:80"
      # Change the number before : to the port the SMTP server should be accessible on
      - "25:25"
      # Change the number before : to the port the IMAP server should be accessible on
      - "143:143"
    volumes:
      # where smtp4dev stores the database
      - smtp4dev-data:/smtp4dev
    environment:
      #Specifies the server hostname. Used in auto-generated TLS certificate if enabled.
      - ServerOptions__HostName=smtp4dev

volumes:
  smtp4dev-data:
  postgres-data:
  minio-data:
